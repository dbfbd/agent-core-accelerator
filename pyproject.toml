[project]
name = "incident-agent"
version = "0.1.0"
description = "Reliable DevOps Incident Agent teaching lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<1",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "mcp>=1.27,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.40,<1",
]

[project.scripts]
incident-agent = "incident_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
